name: PR Review Reminder
on:
  schedule:
    - cron: '0 8,12,16 * * 1-5'
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Find stale PRs (>4h sans review)
        id: stale_prs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            const STALE_HOURS = 1;
            const now = new Date();
            const stalePRs = [];
            const noReviewerPRs = [];
            for (const pr of prs) {
              if (pr.draft) continue;
              const hoursOld = (now - new Date(pr.created_at)) / 3600000;
              if (hoursOld < STALE_HOURS) continue;
              const prMeta = {
                number:   pr.number,
                title:    pr.title,
                author:   pr.user.login,
                url:      pr.html_url,
                hoursOld: Math.floor(hoursOld)
              };
              if (pr.requested_reviewers.length === 0) {
                noReviewerPRs.push(prMeta);
                continue;
              }
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                pull_number: pr.number
              });
              const hasRecentReview = reviews.some(r =>
                (now - new Date(r.submitted_at)) / 3600000 < STALE_HOURS
              );
              if (hasRecentReview) continue;
              stalePRs.push({
                ...prMeta,
                reviewers: pr.requested_reviewers.map(r => r.login).join(', ')
              });
            }
            core.setOutput('stale_prs_json',       JSON.stringify(stalePRs));
            core.setOutput('no_reviewer_prs_json',  JSON.stringify(noReviewerPRs));
            core.setOutput('has_stale',             stalePRs.length > 0       ? 'true' : 'false');
            core.setOutput('has_no_reviewer',       noReviewerPRs.length > 0  ? 'true' : 'false');
            core.setOutput('has_any',               (stalePRs.length + noReviewerPRs.length) > 0 ? 'true' : 'false');
            console.log(`PRs en attente de review : ${stalePRs.length}`);
            console.log(`PRs sans reviewer assigné : ${noReviewerPRs.length}`);

      # ── Rappel PRs sans reviewer ──────────────────────────────────────────
      - name: Comment on PRs without reviewer
        if: steps.stale_prs.outputs.has_no_reviewer == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prs = JSON.parse('${{ steps.stale_prs.outputs.no_reviewer_prs_json }}');
            const today = new Date().toDateString();
            for (const pr of prs) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: pr.number
              });
              const alreadyCommented = comments.some(c =>
                c.user.login === 'github-actions[bot]' &&
                c.body.includes('<!-- no-reviewer -->') &&
                new Date(c.created_at).toDateString() === today
              );
              if (alreadyCommented) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: pr.number,
                body: `<!-- no-reviewer -->
⚠️ @${pr.author} — cette PR est ouverte depuis **${pr.hoursOld}h** mais **aucun reviewer n'est assigné**.
➡️ Merci d'assigner un reviewer pour débloquer la review.`
              });
            }

      # ── Rappel PRs avec reviewer mais sans review ─────────────────────────
      - name: Comment on stale PRs
        if: steps.stale_prs.outputs.has_stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prs = JSON.parse('${{ steps.stale_prs.outputs.stale_prs_json }}');
            const today = new Date().toDateString();
            for (const pr of prs) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: pr.number
              });
              const alreadyCommented = comments.some(c =>
                c.user.login === 'github-actions[bot]' &&
                c.body.includes('<!-- stale-review -->') &&
                new Date(c.created_at).toDateString() === today
              );
              if (alreadyCommented) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: pr.number,
                body: `<!-- stale-review -->
⏰ Rappel : @${pr.reviewers.split(', ').join(', @')} — cette PR attend votre review depuis **+${pr.hoursOld}h**.`
              });
            }

      # ── Construire le body HTML de l'email ───────────────────────────────
      - name: Build email body
        if: steps.stale_prs.outputs.has_any == 'true'
        id: email_body
        run: |
          NO_REVIEWER='${{ steps.stale_prs.outputs.no_reviewer_prs_json }}'
          STALE='${{ steps.stale_prs.outputs.stale_prs_json }}'

          NO_REVIEWER_ROWS=$(echo "$NO_REVIEWER" | jq -r '
            .[] | "<tr>
              <td><a href=\"\(.url)\">#\(.number)</a></td>
              <td>\(.title)</td>
              <td>\(.author)</td>
              <td style=\"color:red\">Non assigné</td>
              <td>\(.hoursOld)h</td>
            </tr>"
          ')

          STALE_ROWS=$(echo "$STALE" | jq -r '
            .[] | "<tr>
              <td><a href=\"\(.url)\">#\(.number)</a></td>
              <td>\(.title)</td>
              <td>\(.author)</td>
              <td>\(.reviewers)</td>
              <td>\(.hoursOld)h</td>
            </tr>"
          ')

          cat <<EOF > /tmp/email_body.html
          <html><body style="font-family:sans-serif;">
          <h2>📋 Suivi des PRs — ${{ github.repository }}</h2>

          <h3>⚠️ PRs sans reviewer assigné</h3>
          <table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;">
            <thead style="background:#fff3cd;">
              <tr><th>PR</th><th>Titre</th><th>Auteur</th><th>Reviewer</th><th>Ancienneté</th></tr>
            </thead>
            <tbody>${NO_REVIEWER_ROWS}</tbody>
          </table>

          <h3>⏰ PRs en attente de review (+${{ env.STALE_HOURS }}h)</h3>
          <table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;">
            <thead style="background:#ffe0b2;">
              <tr><th>PR</th><th>Titre</th><th>Auteur</th><th>Reviewers</th><th>Ancienneté</th></tr>
            </thead>
            <tbody>${STALE_ROWS}</tbody>
          </table>

          <p><a href="https://github.com/${{ github.repository }}/pulls">→ Voir toutes les PRs ouvertes</a></p>
          </body></html>
          EOF

          # Encoder en base64 pour passer entre steps sans problème de caractères spéciaux
          echo "html_b64=$(base64 -w 0 /tmp/email_body.html)" >> $GITHUB_OUTPUT

      # ── Envoi email ───────────────────────────────────────────────────────
      - name: Send email notification
        if: steps.stale_prs.outputs.has_any == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}        # ex: smtp.office365.com
          server_port: ${{ secrets.MAIL_PORT }}             # ex: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.DEV_TEAM_EMAIL }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          subject: "📋 [${{ github.repository }}] Suivi des PRs en attente"
          content_type: text/html
          body: ${{ steps.email_body.outputs.html_b64 }}
          convert_markdown: false
