name: 🔍 Search File in Directory Tree

on:
  workflow_dispatch:
    inputs:
      file_pattern:
        description: 'Nom ou pattern du fichier (ex: config.xml ou *.xml)'
        required: true
        default: '*.xml'
      fail_if_not_found:
        description: 'Échouer si aucun fichier trouvé ?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  search-file:
    name: Search for file
    runs-on: ubuntu-latest

    outputs:
      found:      ${{ steps.search.outputs.found }}
      file_count: ${{ steps.search.outputs.file_count }}
      file_paths: ${{ steps.search.outputs.file_paths }}
      first_file: ${{ steps.search.outputs.first_file }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Recherche récursive
        id: search
        run: |
          set -x
          SEARCH_ROOT="/home/runner/work/pipeline-with-java/pipeline-with-java"
          RAW_PATTERNS="${{ github.event.inputs.file_pattern }}"
          FAIL_IF_NOT_FOUND="${{ github.event.inputs.fail_if_not_found }}"
          LOG_FILE="search_results.log"

          log() {
            echo "$1" | tee -a "$LOG_FILE"
          }

          log "🕐 Début de la recherche : $(date '+%Y-%m-%d %H:%M:%S')"
          log "📂 Dossier racine : $SEARCH_ROOT"
          log "🔎 Pattern(s)     : $RAW_PATTERNS"
          log "---"

          IFS=',' read -ra PATTERNS <<< "$RAW_PATTERNS"
          ALL_FOUND_FILES=""

          for PATTERN in "${PATTERNS[@]}"; do
            PATTERN=$(echo "$PATTERN" | xargs)
            log "🔍 Recherche du pattern : [ $PATTERN ]"

            FOUND=$(find "$SEARCH_ROOT" -type f -name "$PATTERN" 2>/dev/null)

            if [ -z "$FOUND" ]; then
              log "   ⚠️  Aucun fichier trouvé pour [ $PATTERN ]"
            else
              COUNT=$(echo "$FOUND" | wc -l | tr -d ' ')
              log "   ✅ $COUNT fichier(s) trouvé(s) pour [ $PATTERN ] :"
              echo "$FOUND" | while read -r f; do log "      → $f"; done
              ALL_FOUND_FILES=$(printf "%s\n%s" "$ALL_FOUND_FILES" "$FOUND" | sed '/^$/d')
            fi

            log "---"
          done

          # Dédoublonnage
          ALL_FOUND_FILES=$(echo "$ALL_FOUND_FILES" | sort -u | sed '/^$/d')

          if [ -z "$ALL_FOUND_FILES" ]; then
            log "❌ Aucun fichier trouvé pour l'ensemble des patterns."
            echo "found=false"  >> "$GITHUB_OUTPUT"
            echo "file_count=0" >> "$GITHUB_OUTPUT"
            echo "file_paths="  >> "$GITHUB_OUTPUT"
            echo "first_file="  >> "$GITHUB_OUTPUT"

            if [ "$FAIL_IF_NOT_FOUND" = "true" ]; then
              echo "::error::Aucun fichier trouvé — arrêt du workflow."
              log "🕐 Fin de la recherche : $(date '+%Y-%m-%d %H:%M:%S')"
              exit 1
            fi
          else
            TOTAL=$(echo "$ALL_FOUND_FILES" | wc -l | tr -d ' ')
            FIRST_FILE=$(echo "$ALL_FOUND_FILES" | head -n 1)

            # ✅ Bug 1 corrigé — construit depuis ALL_FOUND_FILES
            FILE_PATHS=$(echo "$ALL_FOUND_FILES" | paste -sd ',' -)

            log "📊 Total fichiers trouvés (tous patterns confondus) : $TOTAL"
            log "📄 Premier fichier : $FIRST_FILE"
            log "📄 Tous les fichiers : $FILE_PATHS"

            echo "found=true"             >> "$GITHUB_OUTPUT"
            echo "file_count=$TOTAL"      >> "$GITHUB_OUTPUT"
            echo "file_paths=$FILE_PATHS" >> "$GITHUB_OUTPUT"
            echo "first_file=$FIRST_FILE" >> "$GITHUB_OUTPUT"

            # ✅ Bug 2 corrigé — format multiligne pour upload-artifact
            {
              echo "file_paths_newline<<EOF"
              echo "$ALL_FOUND_FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          log "🕐 Fin de la recherche : $(date '+%Y-%m-%d %H:%M:%S')"
          echo "log_file=$LOG_FILE" >> "$GITHUB_OUTPUT"

      - name: 📋 Afficher le contenu du fichier trouvé
        if: steps.search.outputs.found == 'true'
        run: |
          FILE_PATHS="${{ steps.search.outputs.file_paths }}"
          FILE_COUNT="${{ steps.search.outputs.file_count }}"

          echo "📊 Nombre de fichiers : $FILE_COUNT"
          echo "=================================================="

          IFS=',' read -ra FILES <<< "$FILE_PATHS"

          INDEX=1
          for FILE in "${FILES[@]}"; do
            FILE=$(echo "$FILE" | xargs)
            echo ""
            echo "📄 [$INDEX/$FILE_COUNT] $FILE"
            echo "--------------------------------------------------"
            cat "$FILE"
            echo ""
            echo "=================================================="
            INDEX=$((INDEX + 1))
          done

      - name: 📦 Upload fichiers trouvés comme artifact
        if: steps.search.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fichier-trouve
          path: |
            ${{ steps.search.outputs.file_paths_newline }}
          retention-days: 7

  # Job suivant qui consomme les outputs
  process-file:
    name: Process found file
    runs-on: ubuntu-latest
    needs: search-file
    if: needs.search-file.outputs.found == 'true'

    steps:
      - name: 📥 Télécharger l'artifact fichier-trouve
        uses: actions/download-artifact@v4
        with:
          name: fichier-trouve
          path: ./artifacts/fichier-trouve

      - name: 📋 Afficher le fichier depuis l'artifact
        run: |
          FILE_PATHS="${{ needs.search-file.outputs.file_paths }}"
          FILE_COUNT="${{ needs.search-file.outputs.file_count }}"
          FLAT_DIR="./flat-files"
          mkdir -p "$FLAT_DIR"

          echo "📊 Nombre de fichiers : $FILE_COUNT"
          echo "=================================================="

          IFS=',' read -ra FILES <<< "$FILE_PATHS"
          INDEX=1
          declare -A SEEN_NAMES

          for FILE in "${FILES[@]}"; do
            FILE=$(echo "$FILE" | xargs)
            ARTIFACT_FILE="./artifacts/fichier-trouve/${FILE}"
            FILENAME=$(basename "$FILE")
      
            echo ""
            echo "📄 [$INDEX/$FILE_COUNT] Fichier original : $FILE"
            echo "--------------------------------------------------"
    
            if [ -f "$ARTIFACT_FILE" ]; then
              # Préfixer si nom dupliqué
              if [ -n "${SEEN_NAMES[$FILENAME]+_}" ]; then
                PREFIX=$(echo "$FILE" | tr '/' '__' | sed "s/__${FILENAME}$//")
                FLAT_NAME="${PREFIX}__${FILENAME}"
              else
                FLAT_NAME="$FILENAME"
                SEEN_NAMES[$FILENAME]=1
              fi
      
              cp "$ARTIFACT_FILE" "$FLAT_DIR/$FLAT_NAME"

              echo "📦 Copié vers         : $FLAT_DIR/$FLAT_NAME"
              echo "📁 Taille             : $(du -sh "$ARTIFACT_FILE" | cut -f1)"
              echo "🕐 Modifié            : $(date -r "$ARTIFACT_FILE" '+%Y-%m-%d %H:%M:%S')"
              echo ""
              echo "--- Contenu ---"
              cat "$ARTIFACT_FILE"
              echo "--- Fin ---"
          else
            echo "⚠️  Fichier introuvable : $ARTIFACT_FILE"
            echo "📂 Arborescence de l'artifact :"
            find ./artifacts/fichier-trouve/ -type f | sort
          fi
  
          echo "=================================================="
          INDEX=$((INDEX + 1))
       done
       echo ""
       echo "📂 Contenu final de $FLAT_DIR :"
       ls -lh "$FLAT_DIR"
      - name: 📤 Contenu fichiers → Step Summary
        if: always()
        run: |
          FILE_PATHS="${{ needs.search-file.outputs.file_paths }}"
          FILE_COUNT="${{ needs.search-file.outputs.file_count }}"

          echo "## 📦 Fichiers trouvés ($FILE_COUNT)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          IFS=',' read -ra FILES <<< "$FILE_PATHS"

          INDEX=1
          for FILE in "${FILES[@]}"; do
            FILE=$(echo "$FILE" | xargs)
            FILENAME=$(basename "$FILE")
            ARTIFACT_FILE="./artifacts/fichier-trouve/$FILENAME"

            echo "### [$INDEX/$FILE_COUNT] \`$FILE\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            if [ -f "$ARTIFACT_FILE" ]; then
              echo "- 📁 **Taille** : $(du -sh "$ARTIFACT_FILE" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
              echo "- 🕐 **Modifié** : $(date -r "$ARTIFACT_FILE" '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat "$ARTIFACT_FILE" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "⚠️ Fichier introuvable dans l'artifact." >> "$GITHUB_STEP_SUMMARY"
            fi

            echo "" >> "$GITHUB_STEP_SUMMARY"
            INDEX=$((INDEX + 1))
          done
