name: PR Review Reminder

on:
  schedule:
    - cron: '0 8,12,16 * * 1-5'  # 3x/jour : 8h, 12h, 16h (lundi-vendredi)
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Find stale PRs (>4h sans review)
        id: stale_prs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            const STALE_HOURS = 4;
            const now = new Date();
            const stalePRs = [];

            for (const pr of prs) {
              // Ignorer les drafts
              if (pr.draft) continue;

              // Ignorer les PRs sans reviewer assigné
              if (pr.requested_reviewers.length === 0) continue;

              // Vérifier les reviews déjà soumises
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });

              const hasRecentReview = reviews.some(r => {
                const reviewedAt = new Date(r.submitted_at);
                return (now - reviewedAt) / 3600000 < STALE_HOURS;
              });

              if (hasRecentReview) continue;

              const hoursOld = (now - new Date(pr.created_at)) / 3600000;
              if (hoursOld < STALE_HOURS) continue;

              stalePRs.push({
                number: pr.number,
                title: pr.title,
                author: pr.user.login,
                url: pr.html_url,
                reviewers: pr.requested_reviewers.map(r => r.login).join(', '),
                hoursOld: Math.floor(hoursOld)
              });
            }

            core.setOutput('stale_prs_json', JSON.stringify(stalePRs));
            core.setOutput('has_stale', stalePRs.length > 0 ? 'true' : 'false');
            console.log(`PRs en attente : ${stalePRs.length}`);

      # ── TEAMS ──────────────────────────────────────────────────────────────
      - name: Notify Teams
        if: steps.stale_prs.outputs.has_stale == 'true'
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}
          STALE_PRS: ${{ steps.stale_prs.outputs.stale_prs_json }}
        run: |
          prs=$(echo "$STALE_PRS" | jq -c '.[]')
          facts=""

          while IFS= read -r pr; do
            number=$(echo "$pr" | jq -r '.number')
            title=$(echo  "$pr" | jq -r '.title')
            author=$(echo "$pr" | jq -r '.author')
            url=$(echo    "$pr" | jq -r '.url')
            reviewers=$(echo "$pr" | jq -r '.reviewers')
            hours=$(echo  "$pr" | jq -r '.hoursOld')

            facts="${facts}{\"name\": \"PR #${number} (${hours}h)\", \"value\": \"[${title}](${url}) — auteur: ${author} | reviewers: ${reviewers}\"},"
          done <<< "$prs"

          facts="${facts%,}"  # Retirer la virgule finale

          payload=$(cat <<EOF
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "themeColor": "FF8C00",
            "summary": "PRs en attente de review",
            "sections": [{
              "activityTitle": "⏰ PRs en attente de review depuis +4h",
              "activitySubtitle": "${{ github.repository }}",
              "facts": [${facts}],
              "markdown": true
            }],
            "potentialAction": [{
              "@type": "OpenUri",
              "name": "Voir toutes les PRs ouvertes",
              "targets": [{"os": "default", "uri": "https://github.com/${{ github.repository }}/pulls"}]
            }]
          }
          EOF
          )

          curl -s -X POST "$TEAMS_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$payload"

      # ── EMAIL ───────────────────────────────────────────────────────────────
      - name: Notify by Email
        if: steps.stale_prs.outputs.has_stale == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com   # Ajuster selon votre provider
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.DEV_TEAM_EMAIL }}     # ex: devteam@company.com
          from: GitHub Actions <noreply@company.com>
          subject: "⏰ [${{ github.repository }}] PRs en attente de review (+4h)"
          content_type: text/html
          body: |
            <h2>PRs en attente de review depuis plus de 4h</h2>
            <table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;font-family:sans-serif;">
              <thead style="background:#f0f0f0;">
                <tr>
                  <th>PR</th><th>Titre</th><th>Auteur</th><th>Reviewers assignés</th><th>Ancienneté</th>
                </tr>
              </thead>
              <tbody>
                $(echo '${{ steps.stale_prs.outputs.stale_prs_json }}' | \
                  jq -r '.[] | "<tr><td><a href=\"\(.url)\">#\(.number)</a></td><td>\(.title)</td><td>\(.author)</td><td>\(.reviewers)</td><td>\(.hoursOld)h</td></tr>"')
              </tbody>
            </table>
            <p><a href="https://github.com/${{ github.repository }}/pulls">→ Voir toutes les PRs ouvertes</a></p>
